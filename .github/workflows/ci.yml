name: Website CI

on:
  pull_request:
    branches: [main]

  push:
    branches: [main]

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-ci-${{ github.event.pull_request.number || github.ref }}

  # Bei neuen PR-Commits veraltete Prüfläufe abbrechen.
  # Prüfungen auf main dagegen vollständig durchlaufen lassen.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Website quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: checkout Repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: install dependencies
        run: npm ci

      - name: check website and build
        run: npm run verify